name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only one CI run per branch/PR at a time; a new push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repository. No write access anywhere.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Make `cargo` fail fast on network/registry problems instead of hanging.
  CARGO_NET_RETRY: 10

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      # Keep running the other toolchain even if one fails, so both results are visible.
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (all features)
        run: cargo test --all-features
      # NOTE: the test harness itself links `std`, so this does NOT prove the
      # crate builds without std. It only exercises the non-`std` code paths.
      # The real no_std proof is the `no-std` job below.
      - name: Test (no default features)
        run: cargo test --no-default-features

  no-std:
    name: no_std build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A bare-metal target has no `std` at all, so this only links if the
      # crate is genuinely no_std when the `std` feature is off.
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links, missing docs, etc. fail the build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
